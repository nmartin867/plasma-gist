[General]
AdditionalImportPaths=/usr/lib/qt6/qml
DisableDefaultImports=false

[Warnings]
# Ids declared in main.qml (root, gistModel) and the delegate's `model` context
# property are resolved by the QML engine at runtime but invisible to qmllint
# when it checks each file in isolation.
UnqualifiedAccess=disable
# i18n()/i18np() are injected by KLocalizedContext, not imported.
UnresolvedType=info
